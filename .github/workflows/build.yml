name: Build

on:
  push:
    branches: ["main"]
    tags:     ["v*"]
  pull_request:
    branches: ["main"]

jobs:

  # ── Windows GUI (C# WinForms) ───────────────────────────────────
  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore SdrClient/SdrClient.csproj

      - name: Build
        run: dotnet build SdrClient/SdrClient.csproj -c Release --no-restore

      - name: Publish (self-contained single file)
        run: |
          dotnet publish SdrClient/SdrClient.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish

      - name: Set version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Build installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion="${{ steps.ver.outputs.version }}" `
            SdrClient.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SdrClient-Setup
          path: installer/SdrClient-Setup-*.exe

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: SdrClient-portable
          path: publish/SdrClient.exe

  # ── Node.js bridge ─────────────────────────────────────────────
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bridge/package.json

      - name: Install
        working-directory: bridge
        run: npm install

      - name: Syntax check
        working-directory: bridge
        run: node --check server.js

  # ── Release ────────────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-client, bridge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
